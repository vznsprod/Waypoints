plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'gg.vanezus.waypoint'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'dev.folia:folia-api:1.21.8-R0.1-SNAPSHOT'
    compileOnly 'xyz.jpenilla:squaremap-api:1.3.9'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.9'
}

shadowJar {
    relocate 'com.zaxxer.hikari', 'gg.vanezus.waypoint.libs.hikari'
    relocate 'org.sqlite', 'gg.vanezus.waypoint.libs.sqlite'
    archiveClassifier.set('')
}

build.dependsOn shadowJar
